<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Getting papers</title>
	<link rel="stylesheet" href="retrieval.css">
</head>
<body>
	<main>
		<h1 id="heading">Getting papers</h1>
		<p id="progress" class="progress"></p>
		<p id="title" class="title"></p>
		<p id="note" class="note" role="status"></p>
		<div class="buttons">
			<button id="pause" type="button">Pause</button>
			<button id="continue" type="button" hidden>Continue</button>
			<button id="stop" type="button" class="quiet">Stop</button>
		</div>
		<p class="foot">Pages open one at a time in a separate window. Nothing runs unless you started it.</p>
	</main>
	<script src="retrieval-page.js"></script>
</body>
</html>
