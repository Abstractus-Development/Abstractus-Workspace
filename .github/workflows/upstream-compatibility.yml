name: Upstream compatibility review
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-latest
    steps:
      # See ci.yml: the zotero submodule's symlinks into its own node_modules dangle for us,
      # and a dangling symlink under src/ breaks gulp's directory walk.
      - run: git config --global core.symlinks false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm run build:debug
      - run: npm test
        env:
          HEADLESS: 'true'
